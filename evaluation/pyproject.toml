[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mininet_vsomeip_dnssec"
version = "0.0.1"
description = "Evaluation components and data for mininet experiments of SOME/IP using DNSSEC for service authentication."
authors = [
  { name = "Timo Salomon" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["mininet_vsomeip_dnssec"]
include = ["pyproject.toml", "mininet_vsomeip_dnssec/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mininet_vsomeip_dnssec"]
force-sort-within-sections = true

